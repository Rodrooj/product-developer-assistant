name: product-developer-assistant-standalone

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-65536}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-24h}
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ./standalone-data/ollama:/root/.ollama
    expose:
      - "11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - agent-backend

  agent:
    image: product-developer-assistant:standalone
    build:
      context: .
      dockerfile: Dockerfile.standalone
      args:
        HERMES_BASE_IMAGE: ${HERMES_BASE_IMAGE:-nousresearch/hermes-agent:latest}
      additional_contexts:
        foxmcp-source: ${FOX_MCP_SOURCE_PATH:-../FoxMCP}
    restart: unless-stopped
    init: true
    command: ["gateway", "run"]
    env_file:
      - .env.standalone
    environment:
      HERMES_HOME: /opt/data
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_KEY: ${API_SERVER_KEY}
      API_SERVER_PORT: "8642"
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434/v1}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-ollama}
      LOCAL_MODEL: ${LOCAL_MODEL:-qwen3:4b}
      CHROME: /usr/bin/chromium
      FOXMCP_AUTO_APPROVE: "0"
      FILE_ORGANIZATION_ROOT: /workspace
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HERMES_PORT:-8642}:8642"
    volumes:
      - ./standalone-data:/opt/data
      - ./standalone-workspace:/workspace
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 35s
    networks:
      - agent-backend

networks:
  agent-backend:
    driver: bridge
