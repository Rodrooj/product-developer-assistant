name: Skill tests

on:
  push:
    paths:
      - 'image/seed/config.yaml'
      - 'image/seed/skills/**'
      - 'tests/test_figma_skill.py'
  pull_request:
    paths:
      - 'image/seed/config.yaml'
      - 'image/seed/skills/**'
      - 'tests/test_figma_skill.py'

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run skill tests
        run: python -m unittest tests/test_figma_skill.py -v
